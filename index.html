<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <!-- The three faces that render above-the-fold text: the hero headline (700),
       the sub-copy beneath it (400), and the mono that sets the entire hero
       structure layer. Swapping the mono would reflow the signature moment's
       most important text on first paint, so it is preloaded rather than left
       to swap. Archivo 600 is not here -- it appears below the fold only.
       Paths are stable because scripts/fonts.mjs copies these into public/
       unhashed; Vite would content-hash anything a stylesheet imports. -->
  <link rel="preload" as="font" type="font/woff2" crossorigin
    href="/fonts/archivo-latin-700-normal.woff2" />
  <link rel="preload" as="font" type="font/woff2" crossorigin
    href="/fonts/archivo-latin-400-normal.woff2" />
  <link rel="preload" as="font" type="font/woff2" crossorigin
    href="/fonts/ibm-plex-mono-latin-400-normal.woff2" />
  <meta name="description"
    content="I build full-stack web applications with React, Node.js, and PostgreSQL. IT student at Texas College of Management and IT, Kathmandu, Nepal." />
  <meta name="author" content="Arman Khan" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Arman Khan" />
  <meta property="og:title" content="Arman Khan — Building Full-Stack Web Applications | React, Node.js, PostgreSQL" />
  <meta property="og:description"
    content="I build full-stack web applications with React, Node.js, and PostgreSQL. IT student at Texas College of Management and IT, Kathmandu, Nepal." />
  <meta property="og:url" content="https://armankhan.com.np/" />
  <meta property="og:image" content="https://armankhan.com.np/og-image.jpeg" />
  <meta property="og:image:alt" content="Social preview card for Arman Khan's developer portfolio" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Arman Khan — Building Full-Stack Web Applications | React, Node.js, PostgreSQL" />
  <meta name="twitter:description"
    content="I build full-stack web applications with React, Node.js, and PostgreSQL. IT student at Texas College of Management and IT, Kathmandu, Nepal." />
  <meta name="twitter:image" content="https://armankhan.com.np/og-image.jpeg" />
  <meta name="twitter:image:alt" content="Social preview card for Arman Khan's developer portfolio" />
  <link rel="canonical" href="https://armankhan.com.np/" />
  <title>Arman Khan</title>
  <noscript>
    <!-- Prerendered pages ship inside the route-transition wrapper, whose
         entrance animation starts at opacity 0. Without JS nothing ever
         animates it in, so reveal it up front. -->
    <style>
      [data-route-transition] { opacity: 1 !important; filter: none !important; transform: none !important; }
      .reveal { opacity: 1 !important; transform: none !important; }
      /* Scroll-triggered sections are prerendered at their variant's hidden
         values, because that is the state Motion renders on the server. With
         JS they animate in on scroll; without it nothing ever would, leaving
         most of every page invisible. An !important rule in a stylesheet beats
         a plain inline style, so this reveals them without needing to know
         which elements Motion touched. */
      #root [style*="opacity:0"] { opacity: 1 !important; transform: none !important; }
    </style>
  </noscript>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Arman Khan",
    "url": "https://armankhan.com.np/",
    "jobTitle": "IT Student",
    "description": "IT student from Nepal building full-stack web applications with React, Node.js, and PostgreSQL."
  }
  </script>
</head>

<body>
  <noscript>
    <h1>Arman Khan — Building Full-Stack Web Applications with React, Node.js, and PostgreSQL</h1>
  </noscript>
  <div id="root"></div>

</body>
